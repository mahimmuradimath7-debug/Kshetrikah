# =================================================================
# KSHETRIKAH (क्षेत्रिकः) - Netlify Production Configuration
# =================================================================

[build]
  command = "npm run build"
  publish = ".next"

# Official Netlify Next.js Runtime (App Router, Server Actions, API routes, Middleware)
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
